name: "edit-ta-garden"
tag: "${rmspace:${system.guidance.prompt},_}"
exp_root_dir: "outputs"
seed: 0

data_type: "gs-load"
data:
  batch_size: 4
  source: ???
  max_view_num: ${prod:${data.batch_size},${data.batch_size},2} # (batch_size ** 2) * k
  eval_camera_distance: 4.0
  camera_distance_range: [1.5, 4.0]
#  light_sample_strategy: "dreamfusion3dgs"
  n_val_views: 32 #16  # ${data.max_view_num}
  height: 311
  width: 480
  use_trajectory_anchored_train_dataset: True
  num_inference_steps: 20
  init_inference_step: 0

  random_shuffle_views: False

  elevation_view_num: 2
  azimuth_view_num: 8
  # elevation_range: [-10 , 80]

  context_max_angle_diff: 25.0  # in degrees

  churn_indices: ${system.guidance.churn_indices}

  keyframe_shuffle: true

  opacity_reset_interval: 999999 # disabled
  opacity_restore_interval: 700
  opacity_reset_until: ${system.densify_until_iter}

  reset_gs_enabled: ${system.reset_gs_enabled}
  reset_gs_at: ${system.reset_gs_at}  # in terms of inference step

  per_editing_step_schedule_cfg:
    name: piecewise_linear
    args:
      pts: # [img_inference_step, per_editing_step]
#      # no update
#        - [ 0, 0 ]
#        - [ 20, 0 ]

        - [ 0, 0 ]
        - [ 16, 0 ]
        - [ 17, 40 ]
        - [ 18, 3 ]
        - [ 20, 1 ]

system_type: "ta-gsedit-system-edit"
system:
  gs_source: ???
  edit_begin_step: 0
  max_densify_percent: 0.01
  densify_until_iter: 6500  # TODO: check
  densify_from_iter: 700  # note that iter is referring to gs_update_step_accum in this case
  densification_interval: 500
  max_grad: 5
  min_opacity: 0.005
  min_scale: 1e-5  # TODO: check
  #  prompt_processor_type: "stable-diffusion-prompt-processor"
  #  prompt_processor:
  #    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  #    prompt: 'a bicycle parked next to a bench in a park, all covered with snow, winter'
  edit_until_step: 999999

  opacity_reset_max: 0.01

  reset_gs_enabled: false
  reset_gs_at: []

  masked_loss: true

  guidance_type: "infedit-guidance"
  guidance:
    guidance_scale: 2.0
    source_guidance_scale: 1.0
    batch_size: ${data.batch_size}
    num_inference_steps: ${data.num_inference_steps}

    prompt: "a face of a clown"
    source_prompt: "a face of a person"

    negative_prompt: "dark, blurry, foggy, low resolution, defects, over-saturate, unnatural"

    self_q_edit_step_thresh: 0.8
    self_kv_edit_step_thresh: ${system.guidance.self_q_edit_step_thresh}
    cross_edit_step_thresh: 1.0

    original_blend_factor: 1.0 # disabled
    original_blend_start: 0
    original_blend_until: 20

    sharpen_output: false

    ddcm_until: 1.0 #0.55 #1.0  # TODO: check
    attn_control_until: 1.0
    blend_until: 0.0  # disabled

    use_lcm_guidance: false

#    use_x_tgt_0_as_gt: true

    churn_indices:
      - [ 0, 20 ]  # no churn

    ddcm_coef_schedule_cfg:
      name: piecewise_linear
      args:
        pts: # [img_inference_step, coefficient]
          #      # no update
          #        - [ 0, 0 ]
          #        - [ 20, 0 ]

          - [ 0, 0.95 ]
          - [ 20, 0.95 ]

    error_compensation_cfg:
      name: piecewise_linear
      args:
        pts:  # 11->459, 12->399, 13->359, 14->299, 15->259, 16->199, 17->159, 18->99, 19->59
#          # full compensation
#          - [ 0, 1.0 ]
#          - [ 20, 1.0 ]

          - [ 0, 1.0 ]
          - [ 17, 1.0 ]  # no inject at this step
          - [ 18, 0.0 ]  # TODO: check
          - [ 20, 0.0 ]

  loggers:
    wandb:
      enable: false
      project: 'threestudio_gs'
      name: None

  anchor_weight_multiplier: 1.3
  anchor_weight_init: 0.1 # TODO: disabled later anchor loss. 0.1 -> 0.0
  anchor_weight_init_g0: 0.05

  loss:
    #    lambda_opaque: 0.0
    lambda_sparsity: 0.0
    lambda_opaque: 0.0
    lambda_l1: 10.
    lambda_p: 10.
    lambda_anchor_color: 0
    lambda_anchor_geo: 50
    lambda_anchor_opacity: 50  # 50 -> 0
    lambda_anchor_scale: 200
    lambda_move: 0
    lambda_alpha: 0
    lambda_scale: 0

  gs_lr_scaler: 0.5 #1.0 # 5.0 # 5.0 -> 10  # xyz lr  5 -> 20
  gs_final_lr_scaler: 0.5 #1.0 # 5.0  # xyz lr 5 -> 10
  rotation_lr_scaler: 4 # 2->4
  scaling_lr_scaler: 4 # 2->4
  opacity_lr_scaler: 4 # 2->4
  color_rest_lr_scaler: 0.05
  color_lr_scaler: 5.0

  gradient_clip:
    xyz: 1.5  # 14 -> 10
    opacity: 0.02
    scaling: 0.13
    rotation: 0.10
    features: 0.10
    features_rest: 0.10


  optimizer:
    name: Adam
    args:
      lr: 0.001
      betas: [0.9, 0.99]
      eps: 1.e-15

  exporter:
    save_video: true

trainer:
  accumulate_grad_batches: 4
  max_steps: 250
#  max_epochs: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 50 #100
  enable_progress_bar: true
  precision: 16-mixed


checkpoint:
  save_last: false # save at each validation time
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
#  every_n_epochs: 1
# white_background: true
